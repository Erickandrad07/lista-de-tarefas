<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow | Erick Andrade</title><meta name="description" content="Gerenciador de tarefas simples e prático."><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header class="top"><div><span class="tag">Projeto 01 • JavaScript</span><h1>✅ TaskFlow</h1><p class="subtitle">Organize suas tarefas e acompanhe seu progresso.</p></div><span class="tag">Erick Andrade</span></header><section class="grid"><div class="card"><h2>Nova tarefa</h2><form id="form" class="row stack-mobile"><label class="sr-only" for="task-input">Descrição da tarefa</label><input id="task-input" class="grow" placeholder="Ex.: Estudar lógica de programação" maxlength="120" required><button type="submit">+ Adicionar</button></form><p class="muted" id="status" role="status" aria-live="polite"></p></div><div class="card"><div class="row" style="justify-content:space-between"><div><h2>Suas tarefas</h2><span class="muted" id="counter">0 de 0 concluídas</span></div><button class="ghost" id="clear-done" type="button">Limpar concluídas</button></div><div class="row filters" role="group" aria-label="Filtrar tarefas"><button class="ghost active" type="button" data-filter="all">Todas</button><button class="ghost" type="button" data-filter="active">Pendentes</button><button class="ghost" type="button" data-filter="done">Concluídas</button></div><ul class="tasks" id="tasks"></ul></div></section><footer class="foot">Projeto de portfólio • HTML, CSS e JavaScript • Dados salvos neste navegador</footer></main><script src="script.js" defer></script></body></html>
